<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardSync Authorization</title>
    <script>
      (function () {
        var token = null;
        var hash = window.location.hash || '';
        var match = hash.match(/token=([^&]+)/);
        if (match && match[1]) {
          token = decodeURIComponent(match[1]);
        }

        if (token) {
          try {
            localStorage.setItem('token', token);
          } catch (e) {}

          try {
            if (window.opener && typeof window.opener.authorize === 'function') {
              window.opener.authorize(token);
            }
          } catch (e) {}
        }

        setTimeout(function () {
          window.close();
        }, 600);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #172b4d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        border-radius: 8px;
        padding: 24px 32px;
        box-shadow: 0 1px 3px rgba(9, 30, 66, 0.15);
        text-align: center;
        max-width: 380px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: #44546f;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Authorizing CardSync...</h2>
      <p>Saving your authorization token. This window will close automatically.</p>
    </div>
  </body>
</html>
