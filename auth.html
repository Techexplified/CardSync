<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardSync Authorization</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #172b4d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        border-radius: 10px;
        padding: 28px 32px;
        box-shadow: 0 2px 8px rgba(9, 30, 66, 0.12);
        text-align: center;
        max-width: 480px;
        width: 90%;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #172b4d;
      }
      p {
        margin: 0 0 16px;
        color: #44546f;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .token-box {
        background: #f7f8f9;
        border: 1px solid #dfe1e6;
        border-radius: 6px;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        word-break: break-all;
        margin-bottom: 12px;
      }
      .btn {
        background: #0c66e4;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: #0055cc;
      }
      .success-pill {
        display: inline-block;
        background: #dcfff1;
        color: #1f845a;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="status-pill" class="success-pill">Authorization Received</div>
      <h2>Connected to Trello!</h2>
      <p id="subtext">
        Your authorization token has been captured. If this tab does not close
        automatically, return to your Trello tab.
      </p>

      <div id="token-display" style="display: none;">
        <div id="token-val" class="token-box"></div>
        <button id="copy-btn" class="btn" type="button">Copy Token</button>
      </div>
    </div>

    <script>
      (function () {
        var token = null;
        var hash = window.location.hash || '';
        var match = hash.match(/token=([^&]+)/);
        if (match && match[1]) {
          token = decodeURIComponent(match[1]);
        }

        if (token) {
          try {
            localStorage.setItem('token', token);
          } catch (e) {}

          try {
            if (window.opener && typeof window.opener.authorize === 'function') {
              window.opener.authorize(token);
            }
          } catch (e) {}

          var tokenDisplay = document.getElementById('token-display');
          var tokenVal = document.getElementById('token-val');
          var copyBtn = document.getElementById('copy-btn');
          if (tokenDisplay && tokenVal) {
            tokenDisplay.style.display = 'block';
            tokenVal.textContent = token;
            if (copyBtn) {
              copyBtn.addEventListener('click', function () {
                navigator.clipboard.writeText(token).then(function () {
                  copyBtn.textContent = 'Copied!';
                  setTimeout(function () {
                    copyBtn.textContent = 'Copy Token';
                  }, 2000);
                });
              });
            }
          }

          setTimeout(function () {
            try {
              window.close();
            } catch (e) {}
          }, 1200);
        } else {
          document.getElementById('status-pill').textContent = 'Waiting for Token';
          document.getElementById('status-pill').style.background = '#fff7d6';
          document.getElementById('status-pill').style.color = '#7f5f01';
          document.getElementById('subtext').textContent =
            'No token was found in the URL. Please approve access on Trello.';
        }
      })();
    </script>
  </body>
</html>
